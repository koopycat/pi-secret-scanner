name: CI

on:
    push:
        branches: [main]
    pull_request:
    # Weekly: verify the extension still works with the newest pi release.
    schedule:
        - cron: "0 9 * * 1"
    workflow_dispatch:

jobs:
    check:
        # Pin the runner image so ubuntu-latest migrations cannot silently
        # change the build environment.
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            # Current major releases run on Node 24 and avoid the deprecated
            # Node 20 action-runtime warning.
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test:coverage
              if: matrix.node == 24

    # The critical compatibility job: run the extension inside a REAL pi session
    # (deterministic fake provider — no LLM API key needed) against both the
    # minimum supported pi version and the latest release. Extension-API
    # breakage in a new pi version fails here before it breaks users.
    smoke:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                pi-version: ["0.74.0", "latest"]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Install pi ${{ matrix.pi-version }}
              run: pnpm add -D @earendil-works/pi-coding-agent@${{ matrix.pi-version }}
            - run: pnpm check
            - run: pnpm smoke
